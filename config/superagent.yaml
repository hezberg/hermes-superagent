# hermes-superagent — main configuration
# ---------------------------------------------------------------------------
# This file contains NO providers, NO endpoints and NO keys — by
# design. Providers and models live in Hermes, where you already
# configured them; here you only SELECT, per role, which of them to
# use:
#
#   provider: ""   model: ""   -> the default Hermes profile's model
#   model: "name"              -> the default provider, another model
#   provider: "name"           -> a provider that exists in your
#                                 Hermes config (its `providers:` /
#                                 `custom_providers:` entries, or the
#                                 default model block)
#
# Run `hermes superagent providers` to see what you can select.
# Selecting something Hermes does not have is an install error that
# lists the menu — the suite never invents a provider. To use a new
# provider, add it in Hermes first (Settings -> Providers, or
# hermes setup); it becomes selectable here immediately.
#
# Keys likewise stay in ~/.hermes/.env, the single source of truth:
# the suite reads the key variable each selected provider declares
# and keeps the profiles' copies converged onto it automatically.
#
# (Legacy: a `providers:` section of your own still works — roles
# naming one render from it as before. New configs should not add
# one; selections cover everything it did.)

version: 1

# The Router is a dedicated Hermes profile. It receives tasks, decomposes
# them onto the Kanban board and reports back. It is intentionally given
# NO execution toolsets (see profiles/router) so it cannot do the work
# itself — dispatching is its only job.
router:
  profile: sa-router
  provider: "" # empty = the default Hermes profile's model
  model: "" # a fast, cheap model fits: routing is a judgement call, not a marathon
  reasoning_effort: "" # optional; leave empty to use the provider default

workers:
  # `toolsets` below are the worker's WORK toolsets for its CLI platform
  # selection. The renderer adds memory + skills automatically, and the
  # Hermes dispatcher force-adds the kanban lifecycle tools when it
  # spawns the worker for a card — neither needs listing here.
  #
  # ONE worker by default: it takes every card. Add a worker when a
  # class of work deserves its own model or a tighter toolset — the
  # two classic specialists are shown commented out below; enabling
  # one is uncommenting its block (and selecting its model).
  - name: general
    profile: sa-worker-general
    role: general # everyday tasks: shell, files, web
    provider: ""
    model: "" # your strongest general model
    reasoning_effort: ""
    toolsets: [terminal, file, web]
    max_concurrent: 2
  # - name: research
  #   profile: sa-worker-research
  #   role: research # reading, synthesis, long-form reporting — no shell
  #   provider: ""
  #   model: ""
  #   reasoning_effort: ""
  #   toolsets: [web, file]
  #   max_concurrent: 1
  # - name: deep
  #   profile: sa-worker-deep
  #   role: deep # hard reasoning: debugging, design, review
  #   provider: ""
  #   model: "" # a reasoning model fits here, if you have one
  #   reasoning_effort: "" # e.g. high — deep work is where effort pays
  #   toolsets: [terminal, file, web]
  #   max_concurrent: 1

# Chat entry (optional): route one messaging platform to the Router
# so you can talk to it there. The installer never rewrites your
# main Hermes config; doctor verifies the wiring and prints the
# exact fix when it is missing. Either satisfies it: a
# gateway.profile_routes entry in ~/.hermes/config.yaml sending
# this platform to the router profile, or a dedicated app for the
# platform in the router profile's own .env (FEISHU_APP_ID & co).
entry:
  platform: "" # e.g. feishu; empty = no chat entry managed
  user_id: "" # optional: on a shared bot, route only this sender
  chat_id: "" # optional: route only this chat

# Authorization layer (borrowed from DeepSeek's dsh-superagent-prototype:
# a deterministic Gate in front of the model's judgement, and an immutable
# Mandate recorded on every accepted task).
#
# The Gate runs BEFORE the Router's model sees a request:
#   explicit — the sender is on the source's allowed list and addressed
#              the agent directly: real work may start.
#   inferred — a proactive candidate (a rule matched, or a listed bot
#              produced it): work may start only in `auto` accept mode.
# Anything else is rejected before it costs any model tokens.
policy:
  # observe: inferred candidates are recorded ("would accept") but never
  #          executed — the safe way to start; watch what it would do.
  # auto:    inferred candidates that match a rule become real work.
  # Explicit requests from allowed senders are accepted in both modes.
  accept_mode: observe
  sources:
    # The local operator at the CLI is always allowed (explicit).
    cli:
      allowed_senders: []
    # Fill with the identities (in THIS source's own terms — a Feishu
    # open_id is not a GitHub login) allowed to ask for work. Empty means
    # nobody: the Gate rejects everything from that source.
    feishu:
      allowed_senders: []
    webhook:
      allowed_senders: []
  # Bots whose activity may raise inferred candidates (e.g. CI notifiers).
  bots: []
  # Proactive rules, in your own words. The assessment matches candidates
  # against these; rules can narrow what the agent does unasked, never
  # widen it beyond the sources' allowed lists.
  rules: []
  # - id: ci-failure
  #   instruction: "A CI failure on the main branch is worth a fix task."

watchdog:
  enabled: true
  interval_minutes: 10
  # report-only | nudge | requeue
  # report-only: surface stalled tasks to the human, never touch the board.
  authority: report-only
  stall_minutes: 30 # running task with no board update for this long = stalled
  heartbeat_stale_minutes: 15

events:
  # Fast Path: incoming messages matching a rule skip the Router's LLM
  # judgement. Actions: passthrough (straight to the owning worker),
  # drop (ignore), slowpath (normal Router handling — the default).
  fastpath:
    - pattern: '^/status\b'
      action: passthrough

limits:
  max_workers: 4
  # Always keep one worker slot in reserve for a human's follow-up
  # message, so new work can never starve an existing task's owner.
  reserved_human_slot: true
  # IM-style channels stay low-noise: the Router's chat replies should be
  # short; detail goes into files / board comments. (words, approx.)
  router_reply_max_words: 100

security:
  # Hermes' SSRF guard blocks its web/browser fetches to private,
  # loopback, link-local and CGNAT addresses. Leave this OFF unless
  # this machine legitimately needs those destinations — the classic
  # case is a Clash/mihomo fake-IP DNS setup, where every public name
  # resolves into 198.18.0.0/15 and *all* web fetches get blocked;
  # LAN/tailnet-hosted endpoints are the other. When true, the setting
  # is rendered into EVERY profile (profiles do not inherit the
  # default profile's security settings). This is a deliberate trust
  # boundary in Hermes' own docs: enabling it lets agents fetch
  # arbitrary LAN addresses.
  allow_private_urls: false
